<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="40" y1="70" x2="220" y2="190">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#bg-glow)" stroke="#30363d" stroke-width="3"/>

  <!-- Markdown mark: M + down arrow -->
  <g filter="url(#glow)">
    <path d="M42 180 V78 L86 126 L130 78 V180"
          fill="none" stroke="url(#accent-grad)" stroke-width="24"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="196" y1="78" x2="196" y2="140"
          stroke="url(#accent-grad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M168 136 H224 L196 180 Z"
          fill="url(#accent-grad)" stroke="url(#accent-grad)" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
