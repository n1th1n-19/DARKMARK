name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vsce package
      # Runtime deps must ship: a .vscodeignore glob once dropped markdown-it-katex
      - run: unzip -l *.vsix | grep -q 'node_modules/@vscode/markdown-it-katex/'
