name: Release

# On every merged PR into main: bump version (unless the PR already bumped it),
# tag, build the .vsix and publish a GitHub Release.
# Bump size comes from PR labels: `major`, `minor`, otherwise patch.

# pull_request_target so merged fork PRs get a write token. Safe here: the job only
# runs for merged PRs and only checks out the merge commit already on main.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Bump version
        id: version
        env:
          BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'major') && 'major' || contains(github.event.pull_request.labels.*.name, 'minor') && 'minor' || 'patch' }}
        run: |
          CUR=$(node -p "require('./package.json').version")
          # Version not released yet -> the PR bumped it by hand; ship it as-is
          if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null; then
            # Bump from the newest tag: a queued run's merge commit may predate earlier releases
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
            npm version "$(node -p "require('semver').inc('${LATEST#v}', process.env.BUMP)")" --no-git-tag-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package
        run: npx vsce package

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git diff --quiet package.json package-lock.json; then
            git commit -m "chore(release): v$V [skip ci]" package.json package-lock.json
          fi
          git tag "v$V"
          git push origin "v$V"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: gh release create "v$V" "darkmark-$V.vsix" --title "v$V" --generate-notes

      # Last, so a conflict here never blocks the release. main may have moved past
      # this merge; the bump commit only touches version fields, so rebase onto it.
      - name: Push version bump to main
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.pull_request.merge_commit_sha }}" ]; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
